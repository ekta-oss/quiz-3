<!-- Plain, self-contained build of Quiz 3 (COM-M1-QZ-03, Stage 11.1 Objective Component): no framework and
     nothing to download. Pictures and sounds are inside the file. Generated by scripts/plain-quiz111.mjs. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --page: #fbfbfe; --card: #ffffff; --heading: #0e1a4f; --body: #4c5682; --muted: #5a6389; --border: #e4e8f5;
  --primary: #3c59f6; --primary-hover: #2f4ae0; --select-bg: rgba(60,89,246,.08); --blue-tonal-border: rgba(60,89,246,.35);
  --amber: #f3ab31; --amber-2: #ffc168; --amber-text: #8f5600; --amber-on: #241300;
  --success: #1c7f59; --success-bg: rgba(79,224,168,.16); --success-border: rgba(28,154,107,.4);
  --warn-bg: #fff8e6; --warn-border: #f3c96b; --warn-text: #6b4300; --overlay: rgba(14,26,79,.35);
  --orange-bg: #fff1e3; --orange-border: #f5b97a; --orange-text: #9a4600;
  --teal: #0f6f6a; --teal-bg: #e8f6f5;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
/* Same text sizes as Quiz 2: 16 px root on phones and small laptops, up to 19 px on large monitors. */
html { font-size: clamp(16px, calc(9px + 0.55vw), 19px); }
body { font-size: 1rem; background: var(--page); color: var(--body); font-family: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.4; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
img { display: block; max-width: 100%; }
.top { max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 8px 16px; }
.brand { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: .16em; color: var(--heading); }
.brand img { height: 20px; width: auto; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.clock { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 999px; background: var(--teal-bg); color: var(--teal); font-size: 0.94rem; font-weight: 600; }
.btn-ghost { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border); background: #fff; color: var(--heading); font-size: 0.94rem; font-weight: 600; cursor: pointer; }
.btn-ghost:hover { border-color: var(--blue-tonal-border); }
.layout { max-width: 1240px; margin: 0 auto; padding: 4px 16px 96px; display: grid; gap: 16px; grid-template-columns: 1fr; }
.layout > * { min-width: 0; }
@media (min-width: 900px) {
  .layout { grid-template-columns: 210px minmax(0,1fr); gap: 24px; padding: 4px 32px 28px; }
  nav.navi { position: sticky; top: 12px; align-self: start; }
}
/* Question navigator: numbered circles down the left (a scrolling row on phones). */
.navi-title { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .16em; color: var(--muted); margin: 6px 0 8px; }
.navi-groups { display: flex; gap: 14px; overflow-x: auto; padding: 4px 2px 8px; }
@media (min-width: 900px) { .navi-groups { flex-direction: column; overflow: visible; padding: 0; } }
.navi-group { flex: none; }
.navi-group h3 { margin: 0 0 6px; font-size: 0.82rem; font-weight: 600; color: var(--heading); }
.navi-row { display: flex; gap: 6px; }
@media (min-width: 900px) { .navi-row { flex-wrap: wrap; } }
.nbtn { position: relative; width: 36px; height: 36px; border-radius: 50%; border: 1.5px solid var(--border); background: #fff; color: var(--heading); font-size: 0.88rem; font-weight: 600; cursor: pointer; font-variant-numeric: tabular-nums; }
.nbtn:hover { border-color: var(--blue-tonal-border); }
.nbtn.now { border-color: var(--primary); background: var(--select-bg); color: var(--primary-hover); box-shadow: 0 0 0 3px rgba(60,89,246,.18); }
.nbtn.done { background: #f3f5fc; }
.nbtn .t { position: absolute; right: -4px; bottom: -4px; width: 16px; height: 16px; }
.navi-note { margin: 12px 0 0; font-size: 0.82rem; }
@media (max-width: 899px) { .navi-note { display: none; } }
.card { align-self: start; background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 18px; }
@media (min-width: 640px) { .card { padding: 24px 30px 26px; } }
.card-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; }
.eyebrow { display: flex; align-items: center; gap: 10px; font-size: 0.81rem; font-weight: 600; text-transform: uppercase; letter-spacing: .18em; color: var(--amber-text); }
.eyebrow::before { content: ""; width: 18px; height: 1px; background: var(--amber); }
.badge-a { display: inline-block; padding: 3px 11px; border-radius: 999px; border: 1px solid var(--orange-border); background: var(--orange-bg); color: var(--orange-text); font-size: 0.875rem; font-weight: 700; }
.qline { margin-top: 14px; font-size: 0.875rem; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
h1 { color: var(--heading); font-size: 1.375rem; line-height: 1.3; margin: 10px 0 0; font-weight: 700; text-wrap: balance; }
@media (min-width: 640px) { h1 { font-size: 1.625rem; } }
.howto { margin: 8px 0 0; font-size: 1.06rem; }
.q-body { margin-top: 18px; }
/* Wide screens: the text, list or form sits beside the answers, so the question fits on one screen. */
@media (min-width: 1100px) {
  .q-body.with-text { display: grid; grid-template-columns: minmax(0,1.15fr) minmax(0,1fr); gap: 22px; align-items: start; }
  .q-body.with-text .reading, .q-body.with-text table.list, .q-body.with-text .form { margin-bottom: 0; }
}
/* Phones: a shorter top bar and card heading. */
@media (max-width: 520px) {
  .brand span.long { display: none; }
  .clock, .btn-ghost { height: 36px; padding: 0 11px; font-size: 0.875rem; }
  .card-top .eyebrow { letter-spacing: .12em; }
}
.listen { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.play { display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 18px 0 8px; border-radius: 999px; border: 1px solid var(--blue-tonal-border); background: var(--select-bg); color: var(--primary-hover); font-size: 1rem; font-weight: 700; cursor: pointer; }
.play .ic { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; background: var(--primary); color: #fff; }
.play.playing .ic { box-shadow: 0 0 0 5px rgba(60,89,246,.2); }
.reading { margin: 0 0 16px; padding: 14px 16px; border-radius: 12px; background: #f6f7fc; border: 1px solid var(--border); color: var(--heading); font-size: 1.06rem; line-height: 1.6; }
.reading p { margin: 0; }
.reading .src { margin-top: 8px; font-size: 0.8rem; color: var(--muted); line-height: 1.4; }
table.list { width: 100%; max-width: 560px; border-collapse: collapse; margin: 0 0 16px; font-size: 1rem; color: var(--heading); background: #fffdf6; border: 1px solid #e8dcb8; }
table.list caption { text-align: left; font-weight: 700; padding: 0 0 6px; color: var(--heading); }
table.list th, table.list td { padding: 5px 12px; border-bottom: 1px solid #efe5c8; text-align: left; font-variant-numeric: tabular-nums; }
table.list th { font-size: 0.85rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.form { max-width: 460px; margin: 0 0 16px; padding: 14px 18px; border-radius: 10px; background: #fffaf0; border: 1px solid #e8dcb8; color: var(--heading); }
.form .ft { font-weight: 700; margin-bottom: 8px; }
.form .row { display: grid; grid-template-columns: 9.5rem 1fr; gap: 8px; padding: 5px 0; border-bottom: 1px dashed #e2d3a6; font-variant-numeric: tabular-nums; }
.form .row span:first-child { color: var(--muted); font-weight: 600; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; min-height: 50px; padding: 10px 16px; border: 1.5px solid var(--border); border-radius: 13px; background: #fff; color: var(--heading); font-size: 1.125rem; font-weight: 500; text-align: left; cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--blue-tonal-border); }
.opt[aria-pressed="true"] { border-color: var(--primary); background: var(--select-bg); }
.opt.right { border-color: var(--success); background: var(--success-bg); }
.opt.chosen-wrong { border-color: var(--warn-border); background: var(--warn-bg); }
.opt:disabled { cursor: default; }
.tick { flex: none; width: 20px; height: 20px; }
.pics { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; max-width: 560px; }
.pic { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 12px 10px; border: 1.5px solid var(--border); border-radius: 13px; background: #fff; color: var(--heading); font-size: 1.06rem; font-weight: 600; cursor: pointer; }
.pic img { width: 70%; height: auto; }
.pic[aria-pressed="true"] { border-color: var(--primary); background: var(--select-bg); }
.pic.right { border-color: var(--success); background: var(--success-bg); }
.pic.chosen-wrong { border-color: var(--warn-border); background: var(--warn-bg); }
.pic .tick { position: absolute; top: -8px; right: -8px; background: #fff; border-radius: 50%; }
.board { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; max-width: 760px; }
.target { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 8px; border: 1px solid var(--border); border-radius: 12px; background: #fff; }
.target img { height: 56px; width: auto; }
@media (min-width: 640px) { .target img { height: 80px; } }
.slot { width: 100%; min-height: 56px; padding: 7px; border: 1.5px dashed var(--blue-tonal-border); border-radius: 10px; background: #fff; color: var(--muted); font-size: 0.97rem; line-height: 1.3; cursor: pointer; touch-action: none; }
.slot.filled { border-style: solid; border-color: var(--primary); background: var(--select-bg); color: var(--heading); font-weight: 600; }
.slot.hover { background: rgba(60,89,246,.16); }
.slot.right { border-color: var(--success); background: var(--success-bg); }
.slot.wrong { border-color: var(--warn-border); background: var(--warn-bg); }
.sentence { color: var(--heading); font-size: 1.2rem; line-height: 2.4; }
.sentence .slot { display: inline-block; width: auto; min-width: 7.5rem; min-height: 44px; margin: 0 4px; padding: 4px 12px; vertical-align: middle; text-align: center; font-size: 1.06rem; }
.tray { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 16px; padding: 4px; border-radius: 12px; max-width: 760px; }
.tray.hover { background: var(--select-bg); }
.chip { padding: 7px 14px; min-height: 44px; border: 1.5px solid var(--blue-tonal-border); border-radius: 10px; background: #fff; color: var(--heading); font-size: 1.03rem; font-weight: 600; cursor: grab; touch-action: none; }
.chip[aria-pressed="true"] { border-color: var(--primary); background: var(--select-bg); box-shadow: 0 0 0 3px rgba(60,89,246,.25); }
.chip:disabled { opacity: .45; cursor: default; }
.ghost { position: fixed; z-index: 50; pointer-events: none; transform: translate(-50%,-50%) rotate(-2deg); box-shadow: 0 12px 28px rgba(14,26,79,.25); }
.fb { display: flex; gap: 8px; align-items: flex-start; margin-top: 16px; padding: 11px 14px; border-radius: 12px; font-size: 1.06rem; }
.fb.right { background: var(--success-bg); border: 1px solid var(--success-border); color: #0f4f37; }
.fb.wrong { background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn-text); }
.fb b { font-weight: 700; }
.shake { animation: shake .35s ease-in-out; }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
@media (prefers-reduced-motion: reduce) { .shake { animation: none; } }
.action { display: flex; justify-content: flex-end; margin-top: 20px; }
.btn-amber { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-width: 12rem; min-height: 50px; padding: 0 26px; border: 0; border-radius: 999px; background: linear-gradient(135deg, var(--amber-2), var(--amber)); color: var(--amber-on); font-size: 1.125rem; font-weight: 700; box-shadow: 0 6px 18px rgba(243,171,49,.3); cursor: pointer; }
.btn-amber:disabled { background: #fbe3b9; color: #9a8466; box-shadow: none; cursor: not-allowed; }
.btn-blue { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 20px; border: 1px solid var(--blue-tonal-border); border-radius: 999px; background: var(--select-bg); color: var(--primary-hover); font-size: 1rem; font-weight: 600; cursor: pointer; }
@media (max-width: 899px) {
  .action { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; margin: 0; padding: 8px 16px calc(8px + env(safe-area-inset-bottom)); background: var(--page); border-top: 1px solid var(--border); }
  .action .btn-amber { width: 100%; }
}
.center { text-align: center; }
.score { margin: 18px auto 6px; font-size: 2.6rem; font-weight: 700; color: var(--heading); font-variant-numeric: tabular-nums; }
.score small { font-size: 1.1rem; font-weight: 600; color: var(--muted); }
.sections { max-width: 460px; margin: 18px auto 0; display: grid; gap: 10px; text-align: left; }
.sec { display: grid; grid-template-columns: 7rem 1fr 3.2rem; align-items: center; gap: 10px; color: var(--heading); font-weight: 600; }
.bar { height: 10px; border-radius: 999px; background: var(--border); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--primary); border-radius: 999px; }
.sec span:last-child { text-align: right; font-variant-numeric: tabular-nums; }
.end p { font-size: 1.1rem; }
.modal-bg { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 16px; background: var(--overlay); }
.modal { width: 100%; max-width: 420px; background: #fff; border-radius: 18px; padding: 22px; text-align: center; }
.modal h2 { color: var(--heading); margin: 0 0 6px; font-size: 1.375rem; }
.modal p { margin: 0 0 16px; font-size: 1.03rem; }
.modal .row { display: grid; gap: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>
</head>

    st.attempt.items = st.items.map(function (x, i) { return x.done ? { id: ITEMS[i].id, section: ITEMS[i].section, correct: x.correct, answer: x.sel !== null ? x.sel : x.slots, played: x.played || 0 } : null; }).filter(Boolean);

  }
  function nextUnanswered() {

  // ---------- Drag and tap engine (matching and gap items): meanings and words can always be moved back ----------
  var picked = null, drag = null, suppressClick = false;

  var lastFocus = null;

  document.addEventListener("focusin", function (e) { var id = e.target.getAttribute && e.target.getAttribute("data-testid"); if (id) lastFocus = id; });

  function body(it, c) {

      [h("span", { class: "ic" }, [svg(null, "0 0 16 16", '<path d="M3 6h2.5L9 3v10L5.5 10H3z" fill="currentColor"/><path d="M11 5.5a3.5 3.5 0 0 1 0 5M12.6 3.8a6 6 0 0 1 0 8.4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>')]),

          [h("img", { src: IMG[o.id], alt: "" }), h("span", { text: o.label, "aria-hidden": "true" }), ok ? tick() : null]);

  // ---------- Screens ----------
  function navi() {
    return h("nav", { class: "navi", "aria-label": "Questions" }, [
      h("p", { class: "navi-title", text: "Questions" }),
      h("div", { class: "navi-groups", testid: "navigator" }, SECTIONS.map(function (s) {
        return h("div", { class: "navi-group" }, [h("h3", { text: s }), h("div", { class: "navi-row" }, ITEMS.map(function (it, i) {

          return h("button", { type: "button", class: "nbtn" + (now ? " now" : "") + (x.done ? " done" : ""), testid: "nav-" + (i + 1), "aria-current": now ? "step" : null,
            "aria-label": "Question " + (i + 1) + (x.done ? ", answered" : ", not answered yet"), onclick: function () { if (!st.finished) go(i); } }, [String(i + 1), x.done ? tick("t") : null]);
        }).filter(Boolean))]);

  }
  function cardTop() {
    return h("div", { class: "card-top" }, [h("span", { class: "eyebrow", text: "Module 1 Assessment" }), h("span", { class: "badge-a", testid: "assessment-badge", text: "Assessment" })]);
  }
  function actionBar() {

    if (!c.done) return h("div", { class: "action" }, [h("button", { type: "button", class: "btn-amber", testid: "check", disabled: !answered(), onclick: check }, ["Check", arrow()])]);
    var last = nextUnanswered() < 0;
    return h("div", { class: "action" }, [h("button", { type: "button", class: "btn-amber", testid: last ? "see-score" : "continue", onclick: next }, [last ? "See your score" : "Next question", arrow()])]);
  }

    var app = document.getElementById("app"); app.innerHTML = "";

        ? h("section", { class: "card center end", testid: "assessment-left" }, [cardTop(), h("h1", { tabindex: "-1", text: "You left the assessment" }), h("p", { text: "You can start it again whenever you are ready." }),
            h("div", { class: "action", style: "justify-content:center" }, [h("button", { type: "button", class: "btn-amber", testid: "start-again", onclick: function () { fresh("again"); render(); }, text: "Start again" })])])
        : h("section", { class: "card center end", testid: "results" }, [cardTop(), h("h1", { tabindex: "-1", text: "Assessment complete" }),
            h("p", { class: "score", testid: "score" }, [String(total), h("small", { text: " out of " + ITEMS.length })]),
            h("p", { text: "You answered " + total + " of " + ITEMS.length + " questions correctly. Your result has been saved." }),
            h("div", { class: "sections", testid: "section-scores" }, SECTIONS.map(function (s) {
              var ids = ITEMS.map(function (it, i) { return it.section === s ? i : -1; }).filter(function (i) { return i >= 0; });

              return h("div", { class: "sec", testid: "section-" + s }, [h("span", { text: s }), h("span", { class: "bar", "aria-hidden": "true" }, [h("i", { style: "width:" + (100 * n / ids.length) + "%" })]), h("span", { text: n + " / " + ids.length })]);
            }))]);

    }
    var it = item(), c = cur();
    var n = st.q + 1, inSec = ITEMS.filter(function (x) { return x.section === it.section; }), pos = inSec.indexOf(it) + 1;
    var parts = [cardTop(),
      h("p", { class: "qline", testid: "question-label", text: "Question " + n + " of " + ITEMS.length + " · " + it.section }),
      h("h1", { id: "qhead", tabindex: "-1", text: it.prompt }),

    if (c.done && c.correct) parts.push(h("div", { class: "fb right", testid: "feedback-right", tabindex: "-1", role: "status" }, [tick(), h("span", {}, [h("b", { text: UI.right }), h("span", { testid: "feedback-why", text: " " + it.why })])]));
    if (c.done && !c.correct) parts.push(h("div", { class: "fb wrong", testid: "feedback-wrong", tabindex: "-1", role: "status" }, [h("span", {}, [h("b", { text: UI.wrong + " " }),
      h("span", { testid: "right-answer", text: UI.rightIs + endStop(rightAnswerText(it)) }), h("span", { testid: "feedback-why", text: " " + it.why })])]));
    parts.push(actionBar());

  }

  // ---------- Close ----------
  function showModal(testid, title, text, buttons) {

    var box = h("div", { class: "modal", role: "dialog", "aria-modal": "true", "aria-labelledby": "mtitle", testid: testid }, [
      h("h2", { id: "mtitle", text: title }), h("p", { text: text }),
      h("div", { class: "row" }, buttons.map(function (b, i) { return h("button", { type: "button", class: i === 0 ? "btn-amber" : "btn-blue", testid: b[1], onclick: b[2], text: b[0] }); }))]);
    m.appendChild(h("div", { class: "modal-bg" }, [box])); box.querySelector("button").focus();
  }
  function closeModal() { document.getElementById("modal").innerHTML = ""; }
  document.getElementById("close").addEventListener("click", function () {
    if (st.finished) return;
    showModal("close-card", "Leave the assessment?", "If you leave now, this attempt will not be finished.", [
      ["Keep going", "close-stay", function () { closeModal(); }],
      ["Leave", "close-leave", function () { closeModal(); stopAudio(); clearTimeout(timer); st.attempt.closed = true; saveAttempt(st.attempt); st.finished = true; st.left = true; render(); }]]);
  });

  fresh(null); render();
})();
